minimum_pre_commit_version: '4.0.0'
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Python style
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Python format
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: staged-checks
        name: Staged secrets size and syntax
        entry: python check_staged.py
        language: system
        pass_filenames: false
        always_run: true
